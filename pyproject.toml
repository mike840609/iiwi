[project]
name = "iiwi"
version = "0.13.0"
description = "Agent Session Intelligence for engineering work"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Mike" }]
requires-python = ">=3.11"
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "Jinja2>=3.1,<4",
  "packaging>=24,<26",
  "platformdirs>=4,<5",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "PyYAML>=6,<7",
  "rich>=14,<15",
  "typer>=0.16,<1",
]

[project.optional-dependencies]
dev = [
  "pyright>=1.1.400",
  "pytest>=8.3",
  "pytest-cov>=6",
  "ruff>=0.12",
]

[project.scripts]
iiwi = "iiwi.cli:app"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
# ponytail: importlib import mode is defensive, not a fix for a live bug. The two
# test_mapper.py files under opencode/ and claude_code/ resolve to distinct module
# names today only because claude_code/ has an __init__.py and opencode/ does not.
# A third harness adding test_mapper.py without one would collide; this removes
# the dependency on that asymmetry.
addopts = "-ra --import-mode=importlib"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"
include = ["src"]