name: Fix PR 71 color test

on:
  push:
    branches:
      - agent/collapse-advanced-settings
    paths:
      - .github/workflows/fix-pr71-color-test.yml

permissions:
  contents: write

jobs:
  fix-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/collapse-advanced-settings

      - name: Fix nonselected-setting color assertion
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/unit/interactive/test_render.py")
          text = path.read_text()
          old = '''    settings = _row(text, "Detail")
              assert _glyph_style(action, "G") == "36"
              assert "36" not in _glyph_style(settings, "D")
          '''
          new = '''    settings = _row(text, "Harness")
              assert _glyph_style(action, "G") == "36"
              assert "36" not in _glyph_style(settings, "H")
          '''
          if old not in text:
              raise SystemExit("expected color assertion block not found")
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit and remove temporary workflow
        run: |
          rm .github/workflows/fix-pr71-color-test.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: assert action color against unfocused setting"
          git push origin HEAD:agent/collapse-advanced-settings
