name: Update PR 71 stale tests

on:
  push:
    branches:
      - agent/collapse-advanced-settings
    paths:
      - .github/workflows/update-pr71-stale-tests.yml

permissions:
  contents: write

jobs:
  update-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/collapse-advanced-settings

      - name: Update tests for explicit preview action
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text()
              if old not in text:
                  raise SystemExit(f"expected block not found in {path}: {old[:100]!r}")
              target.write_text(text.replace(old, new, 1))

          path = "tests/unit/interactive/test_controller.py"
          replace_once(
              path,
              '''            KeyPress(key=Key.DOWN),
              KeyPress(key=Key.DOWN),
              KeyPress(key=Key.DOWN),
              KeyPress(key=Key.ENTER),
              KeyPress(key=Key.DOWN),
              KeyPress(key=Key.ENTER),
          ''',
              '''            KeyPress(key=Key.DOWN),
              KeyPress(key=Key.DOWN),
              KeyPress(key=Key.DOWN),
              KeyPress(key=Key.DOWN),
              KeyPress(key=Key.ENTER),
              KeyPress(key=Key.DOWN),
              KeyPress(key=Key.ENTER),
          ''',
          )
          replace_once(
              path,
              '''            KeyPress(key=Key.DOWN),
              KeyPress(key=Key.DOWN),
              KeyPress(key=Key.DOWN),
              KeyPress(key=Key.ENTER),
              KeyPress(key=Key.DOWN),
              KeyPress(key=Key.DOWN),
              KeyPress(key=Key.DOWN),
              KeyPress(key=Key.DOWN),
              KeyPress(key=Key.DOWN),
              char("l"),
          ''',
              '''            KeyPress(key=Key.DOWN),
              KeyPress(key=Key.DOWN),
              KeyPress(key=Key.DOWN),
              KeyPress(key=Key.DOWN),
              KeyPress(key=Key.ENTER),
              KeyPress(key=Key.DOWN),
              KeyPress(key=Key.DOWN),
              KeyPress(key=Key.DOWN),
              KeyPress(key=Key.DOWN),
              char("l"),
          ''',
          )
          replace_once(
              path,
              '''    assert draft.dry_run is True
              assert draft.include_subagents is True
          ''',
              '''    assert draft.sanitize is True
              assert draft.dry_run is False
              assert draft.include_subagents is True
          ''',
          )

          path = "tests/unit/interactive/test_interactive_regressions.py"
          replace_once(
              path,
              '''    draft = ReportDraft(harness="opencode", period=_period(), dry_run=True)
              keys = ScriptedInput(
                  [
                      char("2"),
                      char("r"),
                      char("g"),
                      KeyPress(key=Key.ENTER),
                      KeyPress(key=page_down),
          ''',
              '''    draft = ReportDraft(harness="opencode", period=_period())
              keys = ScriptedInput(
                  [
                      char("2"),
                      KeyPress(key=Key.DOWN),
                      KeyPress(key=Key.ENTER),
                      KeyPress(key=page_down),
          ''',
          )

          path = "tests/unit/interactive/test_render.py"
          replace_once(
              path,
              '''    assert "Sanitize" in text and "Off" in text
              assert "Dry run" in text
              assert "▶ Generate report" in text
          ''',
              '''    assert "Sanitize" in text and "Off" in text
              assert "Preview report" in text
              assert "Dry run" not in text
              assert "▶ Generate report" in text
          ''',
          )
          replace_once(
              path,
              '''    action = next(i for i, line in enumerate(lines) if "Generate report" in line)
              harness = next(i for i, line in enumerate(lines) if "Harness" in line)
              assert action < harness
              assert lines[action + 1].strip() == ""
              assert lines[action].startswith("▶")
          ''',
              '''    action = next(i for i, line in enumerate(lines) if "Generate report" in line)
              preview = next(i for i, line in enumerate(lines) if "Preview report" in line)
              harness = next(i for i, line in enumerate(lines) if "Harness" in line)
              assert action < preview < harness
              assert lines[preview + 1].strip() == ""
              assert lines[action].startswith("▶")
          ''',
          )
          replace_once(
              path,
              '''    render_report_setup(console, draft, selected=4)
              detail_help = stream.getvalue()
          ''',
              '''    render_report_setup(console, draft, selected=5)
              detail_help = stream.getvalue()
          ''',
          )
          replace_once(
              path,
              '''    render_report_setup(console, draft, selected=7)
              text = stream.getvalue()
          ''',
              '''    render_report_setup(console, draft, selected=8)
              text = stream.getvalue()
          ''',
          )
          replace_once(
              path,
              '''    render_report_setup(console, draft, selected=4)
              text = stream.getvalue()
              action = _row(text, "Generate report")
              settings = _row(text, "Dry run")
              assert _glyph_style(action, "G") == "36"
              assert "36" not in _glyph_style(settings, "D")
          ''',
              '''    render_report_setup(console, draft, selected=5)
              text = stream.getvalue()
              action = _row(text, "Generate report")
              settings = _row(text, "Detail")
              assert _glyph_style(action, "G") == "36"
              assert "36" not in _glyph_style(settings, "D")
          ''',
          )

          path = "tests/unit/interactive/test_review_regressions.py"
          replace_once(
              path,
              '''def test_dry_run_result_can_preview_generated_report_content() -> None:
              draft = ReportDraft(harness="opencode", period=_period(), dry_run=True)
          ''',
              '''def test_preview_action_can_preview_generated_report_content() -> None:
              draft = ReportDraft(harness="opencode", period=_period())
          ''',
          )
          replace_once(
              path,
              '''        [
                  char("2"),
                  char("r"),
                  char("g"),
                  KeyPress(key=Key.ENTER),
                  char("b"),
          ''',
              '''        [
                  char("2"),
                  KeyPress(key=Key.DOWN),
                  KeyPress(key=Key.ENTER),
                  char("b"),
          ''',
          )
          PY

      - name: Commit test updates and remove temporary workflow
        run: |
          rm .github/workflows/update-pr71-stale-tests.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: align report setup regressions with preview action"
          git push origin HEAD:agent/collapse-advanced-settings
