name: Update PR 71 stale tests

on:
  push:
    branches:
      - agent/collapse-advanced-settings
    paths:
      - .github/workflows/update-pr71-stale-tests.yml

permissions:
  contents: write

jobs:
  update-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/collapse-advanced-settings

      - name: Update tests for explicit preview action
        run: |
          python - <<'PY'
          from pathlib import Path

          def edit_function(path: str, name: str, edits: list[tuple[str, str]]) -> None:
              target = Path(path)
              text = target.read_text()
              marker = f"def {name}"
              start = text.index(marker)
              end = text.find("\ndef ", start + len(marker))
              if end == -1:
                  end = len(text)
              block = text[start:end]
              for old, new in edits:
                  if old not in block:
                      raise SystemExit(f"expected text not found in {path}:{name}: {old!r}")
                  block = block.replace(old, new, 1)
              target.write_text(text[:start] + block + text[end:])

          down = "            KeyPress(key=Key.DOWN),\n"
          enter = "            KeyPress(key=Key.ENTER),\n"
          left_l = "            char(\"l\"),\n"

          edit_function(
              "tests/unit/interactive/test_controller.py",
              "test_setup_detail_edit_does_not_require_a_scan",
              [(down * 3 + enter + down + enter, down * 4 + enter + down + enter)],
          )
          edit_function(
              "tests/unit/interactive/test_controller.py",
              "test_setup_edits_the_field_under_the_cursor",
              [
                  (down * 3 + enter + down * 5 + left_l, down * 4 + enter + down * 4 + left_l),
                  (
                      "    assert draft.dry_run is True\n    assert draft.include_subagents is True\n",
                      "    assert draft.sanitize is True\n    assert draft.dry_run is False\n    assert draft.include_subagents is True\n",
                  ),
              ],
          )

          edit_function(
              "tests/unit/interactive/test_interactive_regressions.py",
              "test_preview_supports_page_and_boundary_navigation",
              [
                  (
                      "    draft = ReportDraft(harness=\"opencode\", period=_period(), dry_run=True)\n",
                      "    draft = ReportDraft(harness=\"opencode\", period=_period())\n",
                  ),
                  (
                      "            char(\"2\"),\n            char(\"r\"),\n            char(\"g\"),\n            KeyPress(key=Key.ENTER),\n",
                      "            char(\"2\"),\n            KeyPress(key=Key.DOWN),\n            KeyPress(key=Key.ENTER),\n",
                  ),
              ],
          )

          edit_function(
              "tests/unit/interactive/test_render.py",
              "test_report_setup_renders_settings_as_the_navigable_list",
              [
                  (
                      "    assert \"Sanitize\" in text and \"Off\" in text\n    assert \"Dry run\" in text\n",
                      "    assert \"Sanitize\" in text and \"Off\" in text\n    assert \"Preview report\" in text\n    assert \"Dry run\" not in text\n",
                  )
              ],
          )
          edit_function(
              "tests/unit/interactive/test_render.py",
              "test_report_setup_separates_the_generate_action_from_the_settings",
              [
                  (
                      "    harness = next(i for i, line in enumerate(lines) if \"Harness\" in line)\n    assert action < harness\n    assert lines[action + 1].strip() == \"\"\n",
                      "    preview = next(i for i, line in enumerate(lines) if \"Preview report\" in line)\n    harness = next(i for i, line in enumerate(lines) if \"Harness\" in line)\n    assert action < preview < harness\n    assert lines[preview + 1].strip() == \"\"\n",
                  )
              ],
          )
          edit_function(
              "tests/unit/interactive/test_render.py",
              "test_report_setup_describes_the_row_under_the_cursor",
              [("render_report_setup(console, draft, selected=4)", "render_report_setup(console, draft, selected=5)")],
          )
          edit_function(
              "tests/unit/interactive/test_render.py",
              "test_report_setup_explains_why_sanitize_is_unavailable",
              [("render_report_setup(console, draft, selected=7)", "render_report_setup(console, draft, selected=8)")],
          )
          edit_function(
              "tests/unit/interactive/test_render.py",
              "test_report_setup_gives_the_generate_action_its_own_colour",
              [
                  ("render_report_setup(console, draft, selected=4)", "render_report_setup(console, draft, selected=5)"),
                  ("settings = _row(text, \"Dry run\")", "settings = _row(text, \"Detail\")"),
              ],
          )

          edit_function(
              "tests/unit/interactive/test_review_regressions.py",
              "test_dry_run_result_can_preview_generated_report_content",
              [
                  (
                      "def test_dry_run_result_can_preview_generated_report_content() -> None:",
                      "def test_preview_action_can_preview_generated_report_content() -> None:",
                  ),
                  (
                      "    draft = ReportDraft(harness=\"opencode\", period=_period(), dry_run=True)\n",
                      "    draft = ReportDraft(harness=\"opencode\", period=_period())\n",
                  ),
                  (
                      "            char(\"2\"),\n            char(\"r\"),\n            char(\"g\"),\n            KeyPress(key=Key.ENTER),\n",
                      "            char(\"2\"),\n            KeyPress(key=Key.DOWN),\n            KeyPress(key=Key.ENTER),\n",
                  ),
              ],
          )
          PY

      - name: Commit test updates and remove temporary workflow
        run: |
          rm .github/workflows/update-pr71-stale-tests.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: align report setup regressions with preview action"
          git push origin HEAD:agent/collapse-advanced-settings
