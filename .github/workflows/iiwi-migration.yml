name: Iiwi Migration

on:
  push:
    branches:
      - "docs/iiwi-brand-foundation"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/iiwi-brand-foundation
          fetch-depth: 0

      - name: Detect completed migration
        id: guard
        run: |
          if test -d src/iiwi; then
            echo "done=true" >> "$GITHUB_OUTPUT"
          else
            echo "done=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.done != 'true'
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v6
        if: steps.guard.outputs.done != 'true'

      - name: Install baseline dependencies
        if: steps.guard.outputs.done != 'true'
        run: uv sync --locked --extra dev

      - name: Patch temporary runner for CI-only execution
        if: steps.guard.outputs.done != 'true'
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tools/iiwi_brand_migration.py")
          text = path.read_text(encoding="utf-8")

          # Pass only actual built distributions to Twine.
          text = text.replace(
              'run("uv", "tool", "run", "twine", "check", "dist/*")',
              'run("uv", "tool", "run", "twine", "check", '
              '*(str(path) for path in sorted(dist.iterdir()) '
              'if path.name.endswith((".whl", ".tar.gz"))))',
          )

          # Keep the test import order Ruff-clean.
          text = text.replace(
              'history = history.replace("    HistoryEntry,\\n", "    HistoryEntry,\\n    history_file_path,\\n", 1)',
              'history = history.replace("    append_history,\\n", "    append_history,\\n    history_file_path,\\n", 1)',
              1,
          )

          # Runtime identity is project-wide across unit/integration tests.
          text = text.replace(
              '        "tests/unit/test_cli.py",\n    )\n    for path in runtime_test_files:',
              '        "tests/unit/test_cli.py",\n'
              '        "tests/unit/interactive/test_cli_actions.py",\n'
              '    )\n    for path in runtime_test_files:',
              1,
          )
          text = text.replace(
              '    for path in runtime_test_files:\n        replace(path, (("AGENT_WORKLOG", "IIWI"),))\n',
              '    for path in runtime_test_files:\n'
              '        replace(path, (("AGENT_WORKLOG", "IIWI"),))\n'
              '    for test_path in sorted((ROOT / "tests").rglob("*.py")):\n'
              '        replace(str(test_path.relative_to(ROOT)), (("AGENT_WORKLOG", "IIWI"),))\n',
              1,
          )
          text = text.replace(
              '    replace("tests/unit/test_config_store.py", (("agent-worklog", "iiwi"),))\n',
              '    replace("tests/unit/test_config_store.py", (("agent-worklog", "iiwi"),))\n'
              '    replace("tests/unit/test_cli.py", (("agent-worklog", "iiwi"),))\n',
              1,
          )
          text = text.replace(
              '        "tests/unit/test_update.py",\n        "-q",\n    )\n\n    replace_python_tree',
              '        "tests/unit/test_update.py",\n'
              '        "tests/unit/test_cli.py",\n'
              '        "tests/unit/interactive/test_cli_actions.py",\n'
              '        "-q",\n    )\n\n    replace_python_tree',
              1,
          )
          text = text.replace(
              '        "tests/unit/test_update.py",\n        "tests/unit/test_cli.py",\n        "-q",\n    )\n    commit("refactor: move runtime identity to iiwi")',
              '        "tests/unit/test_update.py",\n'
              '        "tests/unit/test_cli.py",\n'
              '        "tests/unit/interactive/test_cli_actions.py",\n'
              '        "-q",\n    )\n'
              '    commit("refactor: move runtime identity to iiwi")',
              1,
          )

          # Product display identity is asserted across integration tests too.
          # Preserve two occurrences that are fixture data for a repository
          # literally named agent-worklog.
          text = text.replace(
              '    render_test = read("tests/unit/interactive/test_render.py")\n',
              '    for test_path in sorted((ROOT / "tests").rglob("*.py")):\n'
              '        replace(str(test_path.relative_to(ROOT)), (("Agent Worklog", "Iiwi"),))\n\n'
              '    replace(\n'
              '        "tests/unit/repositories/test_remote.py",\n'
              '        ((\'== "Iiwi"\', \'== "Agent Worklog"\'),),\n'
              '    )\n'
              '    replace(\n'
              '        "tests/integration/test_end_to_end.py",\n'
              '        ((\'content.count("### Iiwi")\', \'content.count("### Agent Worklog")\'),),\n'
              '    )\n\n'
              '    render_test = read("tests/unit/interactive/test_render.py")\n'
              '    render_test = render_test.replace("_console(width=19)", "_console(width=10)", 1)\n'
              '    render_test = render_test.replace(\n'
              '        "test_main_menu_fits_the_version_at_exactly_twenty_cells",\n'
              '        "test_main_menu_fits_the_version_at_exactly_eleven_cells",\n'
              '        1,\n'
              '    )\n'
              '    render_test = render_test.replace(\n'
              '        "13 title cells + 1 gap + 6 version cells, so width 20",\n'
              '        "4 title cells + 1 gap + 6 version cells, so width 11",\n'
              '        1,\n'
              '    )\n'
              '    render_test = render_test.replace("_console(width=20)", "_console(width=11)", 1)\n',
              1,
          )

          # Match the approved README's bold product-name markup.
          text = text.replace(
              '    add_brand_guard()\n    expect_red(',
              '    replace(\n'
              '        "tests/unit/test_documentation.py",\n'
              '        (("Iiwi *(ee-EE-wee)*", "**Iiwi** *(ee-EE-wee)*"),),\n'
              '    )\n'
              '    add_brand_guard()\n    expect_red(',
              1,
          )

          # GitHub Actions' GITHUB_TOKEN cannot safely be used to push commits
          # that mutate workflow files in this setup. The migration still runs
          # its full direct verification with --cov=iiwi; the two official
          # workflow files are updated afterward through the GitHub connector.
          for workflow_line in (
              '        Path(".github/workflows/ci.yml"),\n',
              '        Path(".github/workflows/release.yml"),\n',
              '        ".github/workflows/ci.yml",\n',
              '        ".github/workflows/release.yml",\n',
          ):
              text = text.replace(workflow_line, "")

          path.write_text(text, encoding="utf-8")
          PY

      - name: Execute approved TDD migration plan
        id: migration
        if: steps.guard.outputs.done != 'true'
        shell: bash
        run: |
          set -o pipefail
          uv run python tools/iiwi_brand_migration.py 2>&1 | tee /tmp/iiwi-migration.log

      - name: Upload migration evidence
        if: always() && steps.guard.outputs.done != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: iiwi-migration-evidence
          path: /tmp/iiwi-migration.log
          if-no-files-found: error

      - name: Push verified migration commits
        if: steps.guard.outputs.done != 'true' && steps.migration.outcome == 'success'
        run: |
          git status --short
          git log --oneline -8
          git push origin HEAD:refs/heads/docs/iiwi-brand-foundation
