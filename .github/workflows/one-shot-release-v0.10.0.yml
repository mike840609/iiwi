name: One-shot release v0.10.0

on:
  push:
    branches:
      - main
      - release/v0.10.0

permissions:
  contents: write
  id-token: write

jobs:
  prepare-lock:
    if: "github.ref == 'refs/heads/release/v0.10.0'"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v6

      - name: Make version-width regression test version-independent
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/unit/interactive/test_render.py")
          text = path.read_text()
          old = '''def test_main_menu_fits_the_version_at_exactly_eleven_cells() -> None:
              import iiwi
              from iiwi.interactive.render import render_main_menu
              console, stream = _console(width=11)
              render_main_menu(console, selected=0)
              title_line = _row(stream.getvalue(), "Iiwi")
              assert f"v{iiwi.__version__}" in title_line
          '''
          new = '''def test_main_menu_fits_the_version_at_exact_width() -> None:
              import iiwi
              from iiwi.interactive.render import render_main_menu
              width = cell_len("Iiwi") + 1 + cell_len(f"v{iiwi.__version__}")
              console, stream = _console(width=width)
              render_main_menu(console, selected=0)
              title_line = _row(stream.getvalue(), "Iiwi")
              assert f"v{iiwi.__version__}" in title_line
          '''
          if old not in text:
              raise SystemExit("expected brittle version-width test not found")
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Refresh lockfile
        run: uv lock

      - name: Commit preparation updates
        run: |
          git add uv.lock tests/unit/interactive/test_render.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: make version width assertion version-independent"
          git push origin HEAD:release/v0.10.0

  release:
    if: "github.ref == 'refs/heads/main' && github.event.head_commit.message == 'chore: prepare v0.10.0'"
    runs-on: ubuntu-latest
    environment: pypi

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v6

      - name: Verify versions and lockfile
        run: |
          project_version="$(python -c 'from pathlib import Path; import tomllib; print(tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"])')"
          package_version="$(python -c 'from pathlib import Path; ns={}; exec(Path("src/iiwi/__init__.py").read_text(), ns); print(ns["__version__"])')"
          test "${project_version}" = "0.10.0"
          test "${package_version}" = "0.10.0"
          uv lock --check

      - name: Verify package
        run: |
          uv sync --locked --extra dev
          uv run pytest --cov=iiwi --cov-fail-under=80
          uv run ruff check .
          uv run pyright
          uv build
          uv tool run twine check dist/*

      - name: Tag release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          test "${GITHUB_SHA}" = "$(git rev-parse HEAD)"
          git tag v0.10.0
          git push origin v0.10.0

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.10.0 \
            --repo "${GITHUB_REPOSITORY}" \
            --title v0.10.0 \
            --generate-notes \
            --verify-tag \
            dist/*
