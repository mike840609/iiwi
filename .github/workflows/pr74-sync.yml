name: PR 74 Sync

on:
  push:
    branches:
      - feat/interactive-g-wordmark

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/interactive-g-wordmark
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Merge latest main and resolve banner overlap
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main

          set +e
          git merge --no-ff --no-commit origin/main
          merge_status=$?
          set -e

          if [ "$merge_status" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U | sort)"
            expected="$(printf '%s\n' \
              src/iiwi/interactive/render.py \
              tests/unit/interactive/test_interactive_regressions.py \
              tests/unit/interactive/test_render.py | sort)"
            if [ "$conflicts" != "$expected" ]; then
              echo 'Unexpected merge conflicts:'
              printf '%s\n' "$conflicts"
              exit 1
            fi

            git checkout --theirs -- \
              src/iiwi/interactive/render.py \
              tests/unit/interactive/test_interactive_regressions.py \
              tests/unit/interactive/test_render.py

            python - <<'PY'
          from pathlib import Path

          render = Path('src/iiwi/interactive/render.py')
          text = render.read_text()
          old = '''# The main menu opens on the name, drawn rather than written, when the terminal
          # can spend four rows on it. A partial wordmark reads as noise, so both gates are
          # all-or-nothing: below either one the one-line title comes back unchanged.
          _WORDMARK = (
              " ___ _        _",
              "|_ _(_)_ __ _(_)",
              " | || \\ V  V / |",
              "|___|_|\\_/\\_/|_|",
          )
          _MIN_WORDMARK_HEIGHT = 24
          # 16 cells of wordmark plus `v0.0.0` on the same row, with a gap between them.
          _MIN_WORDMARK_WIDTH = 24
          '''
          new = '''# The main menu opens on the name, drawn rather than written, when the terminal
          # can spend six rows on it. A partial wordmark reads as noise, so both gates are
          # all-or-nothing: below either one the one-line title comes back unchanged.
          _WORDMARK = (
              "██╗ ██╗ ██╗     ██╗ ██╗",
              "██║ ██║ ██║     ██║ ██║",
              "██║ ██║ ██║ ██╗ ██║ ██║",
              "██║ ██║ ██║██╔██╗██║ ██║",
              "██║ ██║ ╚███╔╝╚███╔╝ ██║",
              "╚═╝ ╚═╝  ╚══╝  ╚══╝  ╚═╝",
          )
          _MIN_WORDMARK_HEIGHT = 24
          # 24 cells of wordmark plus `v0.0.0` and one separating cell.
          _MIN_WORDMARK_WIDTH = 31
          '''
          if text.count(old) != 1:
              raise SystemExit('expected one legacy wordmark block')
          text = text.replace(old, new)
          old_doc = 'the art costs four lines rather than five.'
          if text.count(old_doc) != 1:
              raise SystemExit('expected one legacy wordmark docstring')
          render.write_text(text.replace(old_doc, 'the art costs six lines rather than seven.'))

          render_test = Path('tests/unit/interactive/test_render.py')
          text = render_test.read_text()
          old_assert = '    assert "|___|_|\\\\_/\\\\_/|_|" in text\n'
          new_assert = '    assert "╚═╝ ╚═╝  ╚══╝  ╚══╝  ╚═╝" in text\n'
          if text.count(old_assert) != 1:
              raise SystemExit('expected one legacy wordmark render assertion')
          render_test.write_text(text.replace(old_assert, new_assert))

          regression = Path('tests/unit/interactive/test_interactive_regressions.py')
          text = regression.read_text()
          old_regression = '''    console, main_stream = _console(width=30, height=30)
              interactive_render.render_main_menu(console, selected=0)
              assert len(main_stream.getvalue().splitlines()) == 15
          '''
          new_regression = '''    console, main_stream = _console(width=31, height=30)
              interactive_render.render_main_menu(console, selected=0)
              # 6 wordmark rows, rule, subtitle, link, blank, 4 options, blank,
              # and the hints wrapped across 2 lines at this width.
              assert len(main_stream.getvalue().splitlines()) == 17
          '''
          if text.count(old_regression) != 1:
              raise SystemExit('expected one legacy main-menu viewport assertion')
          regression.write_text(text.replace(old_regression, new_regression))
          PY

            git add \
              src/iiwi/interactive/render.py \
              tests/unit/interactive/test_interactive_regressions.py \
              tests/unit/interactive/test_render.py
          fi

          if git diff --name-only --diff-filter=U | grep -q .; then
            echo 'Unresolved conflicts remain'
            git diff --name-only --diff-filter=U
            exit 1
          fi

          git diff --check

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Test with coverage
        run: uv run pytest --cov=iiwi --cov-fail-under=80

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run pyright

      - name: Build package
        run: uv build

      - name: Commit and push merge
        shell: bash
        run: |
          set -euo pipefail
          git commit -m 'merge: sync G2 banner with latest main'
          git push origin HEAD:feat/interactive-g-wordmark
