name: PR 74 Sync

on:
  push:
    branches:
      - feat/interactive-g-wordmark

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/interactive-g-wordmark
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Merge latest main and resolve banner overlap
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main

          set +e
          git merge --no-ff --no-commit origin/main
          merge_status=$?
          set -e

          if [ "$merge_status" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U | sort)"
            expected='tests/unit/interactive/test_interactive_regressions.py'
            if [ "$conflicts" != "$expected" ]; then
              echo 'Unexpected merge conflicts:'
              printf '%s\n' "$conflicts"
              exit 1
            fi

            git checkout --theirs -- tests/unit/interactive/test_interactive_regressions.py

            python - <<'PY'
          from pathlib import Path

          regression = Path('tests/unit/interactive/test_interactive_regressions.py')
          text = regression.read_text()
          old = '''    console, main_stream = _console(width=30, height=30)
              interactive_render.render_main_menu(console, selected=0)
              assert len(main_stream.getvalue().splitlines()) == 15
          '''
          new = '''    console, main_stream = _console(width=31, height=30)
              interactive_render.render_main_menu(console, selected=0)
              # 6 wordmark rows, rule, subtitle, link, blank, 4 options, blank,
              # and the hints wrapped across 2 lines at this width.
              assert len(main_stream.getvalue().splitlines()) == 17
          '''
          if text.count(old) != 1:
              raise SystemExit('expected one main-menu viewport assertion from main')
          regression.write_text(text.replace(old, new))
          PY

            git add tests/unit/interactive/test_interactive_regressions.py
          fi

          if git diff --name-only --diff-filter=U | grep -q .; then
            echo 'Unresolved conflicts remain'
            git diff --name-only --diff-filter=U
            exit 1
          fi

          python - <<'PY'
          from pathlib import Path

          render = Path('src/iiwi/interactive/render.py').read_text()
          expected_wordmark = '''_WORDMARK = (
              "██╗ ██╗ ██╗     ██╗ ██╗",
              "██║ ██║ ██║     ██║ ██║",
              "██║ ██║ ██║ ██╗ ██║ ██║",
              "██║ ██║ ██║██╔██╗██║ ██║",
              "██║ ██║ ╚███╔╝╚███╔╝ ██║",
              "╚═╝ ╚═╝  ╚══╝  ╚══╝  ╚═╝",
          )'''
          if expected_wordmark not in render or '_MIN_WORDMARK_WIDTH = 31' not in render:
              raise SystemExit('auto-merge did not preserve the G2 runtime wordmark')

          render_test = Path('tests/unit/interactive/test_render.py').read_text()
          if 'assert "╚═╝ ╚═╝  ╚══╝  ╚══╝  ╚═╝" in text' not in render_test:
              raise SystemExit('auto-merge did not preserve the G2 render assertion')
          PY

          git diff --check

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Test with coverage
        run: uv run pytest --cov=iiwi --cov-fail-under=80

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run pyright

      - name: Build package
        run: uv build

      - name: Commit and push merge
        shell: bash
        run: |
          set -euo pipefail
          git commit -m 'merge: sync G2 banner with latest main'
          git push origin HEAD:feat/interactive-g-wordmark
