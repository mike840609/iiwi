name: Sync PR 72

on:
  push:
    branches:
      - agent/simplify-interactive-footer

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/simplify-interactive-footer
          fetch-depth: 0

      - name: Merge latest main and keep footer-only scope
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge -X theirs origin/main --no-edit

          # Drop stale pre-#69/#71 overlap, then reapply only #72-specific renderer assertions.
          git checkout origin/main -- \
            src/iiwi/interactive/controller.py \
            tests/unit/interactive/test_interactive_regressions.py \
            tests/unit/interactive/test_render.py \
            tests/unit/interactive/test_review_regressions.py

          # Rebuild the renderer change from latest main so only footer/help copy differs.
          git checkout origin/main -- src/iiwi/interactive/render.py
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("src/iiwi/interactive/render.py")
          text = path.read_text()

          def replace_hint_block(required: list[str], replacement: list[str]) -> None:
              global text
              pattern = re.compile(r"(?P<indent>\s*)hints = \[\n(?P<body>(?:\s+\"[^\n]+\",\n)+)(?P=indent)\]", re.MULTILINE)
              matches = []
              for match in pattern.finditer(text):
                  body = match.group("body")
                  if all(f'\"{item}\"' in body for item in required):
                      matches.append(match)
              if len(matches) != 1:
                  raise SystemExit(f"expected one hint block for {required}, found {len(matches)}")
              match = matches[0]
              indent = match.group("indent")
              item_indent = indent + "    "
              new = indent + "hints = [\n" + "".join(
                  f'{item_indent}\"{item}\",\n' for item in replacement
              ) + indent + "]"
              text = text[:match.start()] + new + text[match.end():]

          replace_hint_block(
              ["Space Toggle", "a All", "n None", "e Exclude repo", "R Rescan"],
              ["↑↓ jk", "Space Select", "p Inspect", "/ Search", "g Report", "? More", "b Back"],
          )
          replace_hint_block(
              ["p Preview", "R Rescan", "/ Search", "←→ hl"],
              ["↑↓ jk", "p Inspect", "/ Search", "? More", "b Back"],
          )

          old_setup = [
              "↑↓ jk", "←→ hl Change", "Enter Select", "r Review",
              "g Generate", "? Help", "b Back", "q Menu",
          ]
          setup_pattern = re.compile(r"(?P<indent>\s*)\[\n(?P<body>(?:\s+\"[^\n]+\",\n)+)(?P=indent)\],", re.MULTILINE)
          setup_matches = []
          for match in setup_pattern.finditer(text):
              body = match.group("body")
              if all(f'\"{item}\"' in body for item in old_setup):
                  setup_matches.append(match)
          if len(setup_matches) != 1:
              raise SystemExit(f"expected one setup hint list, found {len(setup_matches)}")
          match = setup_matches[0]
          indent = match.group("indent")
          item_indent = indent + "    "
          setup_replacement = ["↑↓ jk", "←→ Change", "r Review", "g Generate", "? More", "b Back"]
          new = indent + "[\n" + "".join(
              f'{item_indent}\"{item}\",\n' for item in setup_replacement
          ) + indent + "],"
          text = text[:match.start()] + new + text[match.end():]

          help_anchor = '        "Enter / Space  Activate / toggle",\n'
          help_additions = (
              '        "a              Select all sessions",\n'
              '        "n              Select no sessions",\n'
          )
          if text.count(help_anchor) != 1:
              raise SystemExit(f"expected one help anchor, found {text.count(help_anchor)}")
          text = text.replace(help_anchor, help_anchor + help_additions, 1)
          path.write_text(text)

          def replace_once(file: str, old: str, new: str) -> None:
              target = Path(file)
              current = target.read_text()
              if current.count(old) != 1:
                  raise SystemExit(f"expected one assertion in {file}, found {current.count(old)}: {old!r}")
              target.write_text(current.replace(old, new, 1))

          replace_once(
              "tests/unit/interactive/test_interactive_regressions.py",
              '    assert len(setup_stream.getvalue().splitlines()) == 21\n',
              '    assert len(setup_stream.getvalue().splitlines()) == 19\n',
          )
          replace_once(
              "tests/unit/interactive/test_render.py",
              '    assert "Space Toggle" in text\n',
              '    assert "Space Select" in text\n',
          )
          replace_once(
              "tests/unit/interactive/test_render.py",
              '    assert "g Generate" in text\n',
              '    assert "g Report" in text\n',
          )
          replace_once(
              "tests/unit/interactive/test_review_regressions.py",
              'def test_report_setup_footer_lists_supported_main_menu_shortcut() -> None:\n',
              'def test_report_setup_footer_omits_redundant_main_menu_shortcut() -> None:\n',
          )
          replace_once(
              "tests/unit/interactive/test_review_regressions.py",
              '    assert "q Menu" in stream.getvalue()\n',
              '    assert "q Menu" not in stream.getvalue()\n',
          )
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Verify footer behavior
        run: uv run pytest tests/unit/interactive/test_simplified_footer.py -q

      - name: Verify full suite
        run: |
          uv run pytest --cov=iiwi --cov-fail-under=80
          uv run ruff check .
          uv run pyright
          uv build

      - name: Commit synced branch and remove helper workflow
        run: |
          git rm .github/workflows/sync-pr72.yml
          git add -A
          git commit -m "chore: sync footer simplification with latest main"
          git push origin HEAD:agent/simplify-interactive-footer
