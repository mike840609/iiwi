name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.10.0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v6

      - name: Verify release target
        run: |
          version="$(python -c 'from pathlib import Path; import tomllib; print(tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"])')"
          test "${version}" = "0.10.0"
          test "$(git rev-parse HEAD)" = "d3ee7120a4707db6df2bf08902d063366e155e37"

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Verify package
        run: |
          uv run pytest --cov=iiwi --cov-fail-under=80
          uv run ruff check .
          uv run pyright
          uv build
          uv tool run twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi

    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  release:
    needs: publish
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "v0.10.0" \
            --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create "v0.10.0" \
              --repo "${GITHUB_REPOSITORY}" \
              --draft \
              --title "v0.10.0" \
              --generate-notes \
              --verify-tag
          fi

          is_draft="$(gh release view "v0.10.0" \
            --repo "${GITHUB_REPOSITORY}" \
            --json isDraft \
            --jq .isDraft)"
          if test "${is_draft}" = "false"; then
            for artifact in dist/*; do
              gh release view "v0.10.0" \
                --repo "${GITHUB_REPOSITORY}" \
                --json assets \
                --jq '.assets[].name' |
                grep -Fxq "$(basename "${artifact}")"
            done
            exit 0
          fi

          gh release upload "v0.10.0" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber
          gh release edit "v0.10.0" \
            --repo "${GITHUB_REPOSITORY}" \
            --draft=false
