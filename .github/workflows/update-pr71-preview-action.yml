name: Update PR 71 preview action

on:
  push:
    branches:
      - agent/collapse-advanced-settings
    paths:
      - .github/workflows/update-pr71-preview-action.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/collapse-advanced-settings
          fetch-depth: 0

      - name: Apply preview-action UX
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text()
              if old not in text:
                  raise SystemExit(f"expected block not found in {path}: {old[:80]!r}")
              target.write_text(text.replace(old, new, 1))

          render = "src/iiwi/interactive/render.py"
          replace_once(
              render,
              '''_PRIMARY_SETUP_FIELDS = ["Harness", "Period"]
          _ADVANCED_SETUP_FIELDS = ["Detail", "Subagents", "Narrative", "Sanitize", "Dry run"]
          _ADVANCED_ROW = "Advanced settings"
          # Generate is the screen's one terminal action, so it gets the first row, above
          # a blank line and a dim group label. Review stays a key: it is a detour, not
          # the destination.
          _GENERATE_ROW = "Generate report"
          _SETTINGS_LABEL = "Settings"
          ''',
              '''_PRIMARY_SETUP_FIELDS = ["Harness", "Period"]
          _ADVANCED_SETUP_FIELDS = ["Detail", "Subagents", "Narrative", "Sanitize"]
          _ADVANCED_ROW = "Advanced settings"
          # Report setup begins with two terminal actions. Preview uses the same report
          # pipeline in dry-run mode, but dry-run is an execution choice rather than a
          # persistent setting the user has to toggle and then remember to undo.
          _GENERATE_ROW = "Generate report"
          _PREVIEW_ROW = "Preview report"
          _ACTION_ROWS = [_GENERATE_ROW, _PREVIEW_ROW]
          _SETTINGS_LABEL = "Settings"
          ''',
          )
          replace_once(
              render,
              '''    "Sanitize": "Ask OpenCode to redact session content on export.",
              "Dry run": "Print the report instead of writing a file.",
              "Generate report": "Scan the period and produce the report.",
          ''',
              '''    "Sanitize": "Ask OpenCode to redact session content on export.",
              "Generate report": "Scan the period and produce the report.",
              "Preview report": "Preview the report without writing a file.",
          ''',
          )
          replace_once(
              render,
              '''def report_setup_rows(*, advanced: bool = True) -> list[str]:
              """Return setup rows, optionally including lower-frequency controls."""

              rows = [_GENERATE_ROW, *_PRIMARY_SETUP_FIELDS, _ADVANCED_ROW]
              if advanced:
                  rows.extend(_ADVANCED_SETUP_FIELDS)
              return rows


          def report_generate_row() -> str:
              """Return the action row's label, so identity checks survive any reordering."""

              return _GENERATE_ROW
          ''',
              '''def report_setup_rows(*, advanced: bool = True) -> list[str]:
              """Return setup actions and settings in keyboard-navigation order."""

              rows = [*_ACTION_ROWS, *_PRIMARY_SETUP_FIELDS, _ADVANCED_ROW]
              if advanced:
                  rows.extend(_ADVANCED_SETUP_FIELDS)
              return rows


          def report_generate_row() -> str:
              """Return the write-to-disk action label."""

              return _GENERATE_ROW


          def report_preview_row() -> str:
              """Return the no-write preview action label."""

              return _PREVIEW_ROW
          ''',
          )
          replace_once(
              render,
              '''    if field == "Sanitize":
                  if draft.harness != "opencode":
                      return "N/A"
                  return _bool_label(draft.sanitize, "On", "Off")
              return _bool_label(draft.dry_run, "On", "Off")
          ''',
              '''    if field == "Sanitize":
                  if draft.harness != "opencode":
                      return "N/A"
                  return _bool_label(draft.sanitize, "On", "Off")
              raise ValueError(f"Unknown report setup field: {field}")
          ''',
          )
          replace_once(
              render,
              '''def render_report_setup(
              console: Console,
              draft: ReportDraft,
              *,
              selected: int,
              advanced: bool = True,
          ) -> None:
              _print_header(console, "Generate Report")
              console.print()
              action_selected = selected == 0
              _print_viewport_line(
                  console,
                  f"{_CURSOR if action_selected else ' '} {_GENERATE_ROW}",
                  style=_CURSOR_STYLE if action_selected else _ACTION_STYLE,
              )
              console.print()
              if console.size.height >= _MIN_SUBTITLE_HEIGHT:
                  _print_viewport_line(console, f"  {_SETTINGS_LABEL}", style="bright_black")
              rows = report_setup_rows(advanced=advanced)
              for index, field in enumerate(rows[1:], start=1):
                  focused = selected == index
                  if field == _ADVANCED_ROW:
                      cursor = _CURSOR if focused else " "
                      glyph = "▾" if advanced else "▸"
                      _print_viewport_line(
                          console,
                          f"{cursor} {field:<{_SETUP_LABEL_CELLS}}{glyph}",
                          style=_CURSOR_STYLE if focused else "",
                      )
                      continue
                  style = (
                      _CURSOR_STYLE
                      if focused
                      else ("dim" if field == "Sanitize" and draft.harness != "opencode" else "")
                  )
                  cursor = _CURSOR if focused else " "
                  _print_viewport_line(
                      console,
                      f"{cursor} {field:<{_SETUP_LABEL_CELLS}}{_setup_value(draft, field)}",
                      style=style,
                  )
              console.print()
              _print_viewport_line(console, _setup_help(draft, rows[selected]), style="dim")
              console.print()
              _print_hints(
                  console,
                  [
                      "↑↓ jk",
                      "←→ hl Change",
                      "Enter Select",
                      "r Review",
                      "g Generate",
                      "? Help",
                      "b Back",
                      "q Menu",
                  ],
              )
          ''',
              '''def render_report_setup(
              console: Console,
              draft: ReportDraft,
              *,
              selected: int,
              advanced: bool = True,
          ) -> None:
              _print_header(console, "Generate Report")
              console.print()
              rows = report_setup_rows(advanced=advanced)
              for index, action in enumerate(_ACTION_ROWS):
                  focused = selected == index
                  _print_viewport_line(
                      console,
                      f"{_CURSOR if focused else ' '} {action}",
                      style=_CURSOR_STYLE if focused else _ACTION_STYLE,
                  )
              console.print()
              if console.size.height >= _MIN_SUBTITLE_HEIGHT:
                  _print_viewport_line(console, f"  {_SETTINGS_LABEL}", style="bright_black")
              settings_start = len(_ACTION_ROWS)
              for index, field in enumerate(rows[settings_start:], start=settings_start):
                  focused = selected == index
                  if field == _ADVANCED_ROW:
                      cursor = _CURSOR if focused else " "
                      glyph = "▾" if advanced else "▸"
                      _print_viewport_line(
                          console,
                          f"{cursor} {field:<{_SETUP_LABEL_CELLS}}{glyph}",
                          style=_CURSOR_STYLE if focused else "",
                      )
                      continue
                  style = (
                      _CURSOR_STYLE
                      if focused
                      else ("dim" if field == "Sanitize" and draft.harness != "opencode" else "")
                  )
                  cursor = _CURSOR if focused else " "
                  if field in _ADVANCED_SETUP_FIELDS:
                      line = (
                          f"{cursor}   {field:<{_SETUP_LABEL_CELLS - 2}}"
                          f"{_setup_value(draft, field)}"
                      )
                  else:
                      line = f"{cursor} {field:<{_SETUP_LABEL_CELLS}}{_setup_value(draft, field)}"
                  _print_viewport_line(console, line, style=style)
              console.print()
              _print_viewport_line(console, _setup_help(draft, rows[selected]), style="dim")
              console.print()
              _print_hints(
                  console,
                  [
                      "↑↓ jk",
                      "←→ hl Change",
                      "Enter Select",
                      "r Review",
                      "g Generate",
                      "? Help",
                      "b Back",
                      "q Menu",
                  ],
              )
          ''',
          )

          controller = "src/iiwi/interactive/controller.py"
          replace_once(
              controller,
              '''    report_generate_row,
              report_preview_capacity,
          ''',
              '''    report_generate_row,
              report_preview_capacity,
              report_preview_row,
          ''',
          )
          replace_once(
              controller,
              '''    elif field == "Sanitize":
                  if draft.harness == "opencode":
                      draft.set_sanitize(not draft.sanitize)
              elif field == "Dry run":
                  draft.set_dry_run(not draft.dry_run)
          ''',
              '''    elif field == "Sanitize":
                  if draft.harness == "opencode":
                      draft.set_sanitize(not draft.sanitize)
          ''',
          )
          replace_once(
              controller,
              '''def _setup_key(state: _State, key: KeyPress, actions: InteractiveActions) -> None:
              rows = report_setup_rows(advanced=state.setup_advanced)
              state.setup_cursor = _move(state.setup_cursor, key, len(rows))
              if _char(key, "q") or key.key is Key.ESCAPE or _char(key, "b"):
                  state.screen = Screen.MAIN
                  return
              if _char(key, "r"):
                  state.review_from_main = False
                  _review(state, actions)
                  return
              if _char(key, "g"):
                  _generate_from_setup(state, actions)
                  return
              row = rows[state.setup_cursor]
              if row == report_generate_row():
                  # Generating writes a file, so the action row answers to Enter alone —
                  # a stray left/right while scrolling the settings must not produce a report.
                  if key.key is Key.ENTER:
                      _generate_from_setup(state, actions)
                  return
              horizontal_edit = key.key in {Key.LEFT, Key.RIGHT} or _char(key, "h") or _char(key, "l")
              if key.key is not Key.ENTER and not horizontal_edit:
                  return
              if row == _ADVANCED_ROW:
                  state.setup_advanced = not state.setup_advanced
                  if not state.setup_advanced:
                      state.setup_cursor = min(state.setup_cursor, 3)
                  return
              _edit_setup_field(state, actions, field=row)
          ''',
              '''def _setup_key(state: _State, key: KeyPress, actions: InteractiveActions) -> None:
              rows = report_setup_rows(advanced=state.setup_advanced)
              state.setup_cursor = _move(state.setup_cursor, key, len(rows))
              if _char(key, "q") or key.key is Key.ESCAPE or _char(key, "b"):
                  state.screen = Screen.MAIN
                  return
              if _char(key, "r"):
                  assert state.draft is not None
                  state.draft.set_dry_run(False)
                  state.review_from_main = False
                  _review(state, actions)
                  return
              if _char(key, "g"):
                  _generate_from_setup(state, actions, preview=False)
                  return
              row = rows[state.setup_cursor]
              if row in {report_generate_row(), report_preview_row()}:
                  # Actions answer to Enter alone. Left/right remains reserved for changing
                  # settings, so scrolling across an action can never execute it by accident.
                  if key.key is Key.ENTER:
                      _generate_from_setup(
                          state,
                          actions,
                          preview=row == report_preview_row(),
                      )
                  return
              horizontal_edit = key.key in {Key.LEFT, Key.RIGHT} or _char(key, "h") or _char(key, "l")
              if key.key is not Key.ENTER and not horizontal_edit:
                  return
              if row == _ADVANCED_ROW:
                  advanced_index = rows.index(_ADVANCED_ROW)
                  state.setup_advanced = not state.setup_advanced
                  if not state.setup_advanced:
                      state.setup_cursor = min(state.setup_cursor, advanced_index)
                  return
              _edit_setup_field(state, actions, field=row)
          ''',
          )
          replace_once(
              controller,
              '''def _generate_from_setup(state: _State, actions: InteractiveActions) -> None:
              """Scan the way Review does, then generate against the selection it built.

              `_generate` needs `state.selection`, which only `_review` establishes, and
              `_review` is also what surfaces a failed or empty scan. Reusing it means
              generating from here cannot reach a state that reviewing first could not.
              """
              state.review_from_main = False
              _review(state, actions)
              if state.screen is not Screen.SESSION_REVIEW:
                  return
              _generate(state, actions, force=False)
          ''',
              '''def _generate_from_setup(
              state: _State,
              actions: InteractiveActions,
              *,
              preview: bool,
          ) -> None:
              """Generate from setup, using dry-run only for the Preview action.

              Both actions share the same scan and restored selection. Preview temporarily
              enables ``dry_run`` for the business layer, then restores the draft so a later
              Generate action can never inherit a hidden no-write mode.
              """
              assert state.draft is not None
              draft = state.draft
              draft.set_dry_run(preview)
              try:
                  state.review_from_main = False
                  _review(state, actions)
                  if state.screen is not Screen.SESSION_REVIEW:
                      return
                  _generate(state, actions, force=False)
              finally:
                  draft.set_dry_run(False)
              if preview and state.screen is Screen.REPORT_RESULT:
                  state.preview_offset = 0
                  state.preview_return_screen = Screen.REPORT_SETUP
                  state.screen = Screen.REPORT_PREVIEW
          ''',
          )
          replace_once(
              controller,
              '''    if choice == "Preview report":
                  state.preview_offset = 0
                  state.screen = Screen.REPORT_PREVIEW
          ''',
              '''    if choice == "Preview report":
                  state.preview_offset = 0
                  state.preview_return_screen = Screen.REPORT_RESULT
                  state.screen = Screen.REPORT_PREVIEW
          ''',
          )
          replace_once(
              controller,
              '''    if key.key is Key.ESCAPE or _char(key, "b"):
                  state.screen = Screen.REPORT_RESULT
                  return
              lines = state.result.content.splitlines() or [""]
          ''',
              '''    if key.key is Key.ESCAPE or _char(key, "b"):
                  state.screen = state.preview_return_screen or Screen.REPORT_RESULT
                  state.preview_return_screen = None
                  return
              lines = state.result.content.splitlines() or [""]
          ''',
          )
          replace_once(
              controller,
              '''    elif state.screen is Screen.REPORT_PREVIEW:
                  state.screen = Screen.REPORT_RESULT
          ''',
              '''    elif state.screen is Screen.REPORT_PREVIEW:
                  state.screen = state.preview_return_screen or Screen.REPORT_RESULT
                  state.preview_return_screen = None
          ''',
          )
          replace_once(
              controller,
              '''    state.preview_offset = 0
              state.expanded_repositories = set()
              _reset_search(state)
          ''',
              '''    state.preview_offset = 0
              state.preview_return_screen = None
              state.expanded_repositories = set()
              _reset_search(state)
          ''',
          )

          plan = "docs/plans/2026-08-10-collapse-advanced-settings.md"
          replace_once(
              plan,
              '''**Goal:** Reduce report-setup cognitive load by showing Harness and Period as primary controls and placing Detail, Subagents, Narrative, Sanitize, and Dry run behind one expandable Advanced settings row.
          ''',
              '''**Goal:** Reduce report-setup cognitive load with explicit Generate/Preview actions, primary Harness and Period controls, and Detail, Subagents, Narrative, and Sanitize behind one expandable Advanced settings row.
          ''',
          )
          replace_once(
              plan,
              '''- Primary rows: `Generate report`, `Harness`, `Period`, `Advanced settings`.
          - Advanced rows when expanded: `Detail`, `Subagents`, `Narrative`, `Sanitize`, `Dry run`.
          ''',
              '''- Action rows: `Generate report`, `Preview report`.
          - Primary settings: `Harness`, `Period`, `Advanced settings`.
          - Advanced rows when expanded: `Detail`, `Subagents`, `Narrative`, `Sanitize`, indented beneath the disclosure row.
          - `Preview report` uses dry-run internally and returns directly to report preview; `Dry run` is no longer a visible setup setting.
          ''',
          )
          replace_once(
              plan,
              '''- [ ] Write a render test asserting Harness/Period/Advanced settings are visible while Detail/Subagents/Narrative/Sanitize/Dry run are not visible by default.
          - [ ] Write a controller/render-flow test that activates Advanced settings and then sees the five advanced rows.
          ''',
              '''- [ ] Write a render test asserting Generate/Preview plus Harness/Period/Advanced settings are visible while the four advanced fields are collapsed by default.
          - [ ] Write a controller/render-flow test that activates Advanced settings and sees the four indented advanced rows.
          - [ ] Write controller tests proving Preview uses dry-run temporarily and Generate always writes normally.
          ''',
          )
          replace_once(
              plan,
              '''- `report_setup_rows(*, advanced: bool)` returns the action, primary settings, Advanced settings row, and optionally advanced fields.
          ''',
              '''- `report_setup_rows(*, advanced: bool)` returns both action rows, primary settings, Advanced settings, and optionally the indented advanced fields.
          ''',
          )
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Verify targeted behavior
        run: uv run pytest tests/unit/interactive/test_collapsed_advanced_settings.py -q

      - name: Verify full suite
        run: |
          uv run pytest --cov=iiwi --cov-fail-under=80
          uv run ruff check .
          uv run pyright
          uv build

      - name: Commit update and remove temporary workflow
        run: |
          rm .github/workflows/update-pr71-preview-action.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: make report preview an explicit action"
          git push origin HEAD:agent/collapse-advanced-settings
